name: looper_player
description: "Looper Player - A powerful music player."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.7.5+44

environment:
  sdk: ^3.11.0


dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.9
  lucide_icons_flutter: ^3.1.19
  animations: ^3.0.0
  window_manager: ^0.5.2
  google_fonts: ^8.2.1
  squiggly_slider: ^2.0.0
  adaptive_palette: ^3.1.0
  material_color_utilities: any

  # State Management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Audio Playback
  mpv_audio_kit: ^0.4.5

  # Database
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  
  # SVG Support
  flutter_svg: ^2.3.0
  lottie: ^3.3.0

  # Utilities
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  path: ^1.9.1
  permission_handler: ^11.3.1
  file_picker: ^12.3.0
  http: ^1.6.0
  xml: ^6.6.1
  cached_network_image: ^3.4.1
  share_plus: ^13.3.0
  marqueer: ^2.5.0
  wakelock_plus: ^1.8.0
  flutter_hsvcolor_picker: ^1.5.1
  flutter_displaymode: ^0.7.0
  package_info_plus: ^10.2.1
  home_widget: ^0.9.4
  metadata_god: ^1.1.0
  appambit_sdk_flutter: ^1.2.0
  gal: ^2.3.3
  haptic_feedback: ^0.8.0
  vibration: ^3.2.1
  skeletonizer: ^3.0.0
  crypto: ^3.0.7
  audio_metadata_reader: ^1.8.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.3
  isar_community_generator: ^3.3.2
  flutter_distributor: ^0.6.6
  flutter_launcher_icons: ^0.14.4
  coverage: ^1.15.1

dependency_overrides:
  # metadata_god 1.1.0 ships Rust and Dart glue generated with exactly
  # flutter_rust_bridge 2.11.1 and refuses to initialise on any other
  # runtime version. Left to float (its constraint is ^2.11.1) pub picks a
  # newer one and tag reading silently stops working. Drop this pin only
  # together with a metadata_god release built on a newer bridge.
  flutter_rust_bridge: 2.11.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/launcher_icon.png"
  adaptive_icon_background: "#242424" #55DF69"
  adaptive_icon_foreground: "assets/branding/launcher_icon_adaptive.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  # Only runtime assets are bundled. assets/branding/ holds build-time
  # artwork (launcher + Linux icons, README logos) and is intentionally
  # left out.
  assets:
    - assets/animations/
    - assets/avatars/
    - assets/icons/android/
    - assets/icons/desktop/
    - assets/icons/social/
    - assets/images/
    - assets/images/about/
  shaders:
    - media/shaders/ambient_noise.frag
  fonts:
    - family: Jost
      fonts:
        - asset: assets/fonts/jost/Jost-Thin.ttf
          weight: 100
        - asset: assets/fonts/jost/Jost-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/jost/Jost-Light.ttf
          weight: 300
        - asset: assets/fonts/jost/Jost-Regular.ttf
          weight: 400
        - asset: assets/fonts/jost/Jost-Medium.ttf
          weight: 500
        - asset: assets/fonts/jost/Jost-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jost/Jost-Bold.ttf
          weight: 700
        - asset: assets/fonts/jost/Jost-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/jost/Jost-Black.ttf
          weight: 900
    - family: Poppins
