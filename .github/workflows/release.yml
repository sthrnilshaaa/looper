name: Build and Release

# Manual only. Empty release_tag = build only, no release.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'What to build'
        type: choice
        options: [all, android, linux]
        default: all
      release_tag:
        description: 'Release tag to publish to (empty = build only)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.7'
  FLUTTER_COMMIT: 'abaf9c523780a608bd46686fd5e53740a07077f8'
  SIGNING_CERT_SHA256: '3bd6ad7d7a9ebefadfec703800b40d76e397b10a305d1e0213c0c9c9f9d74976'

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check version and release tag
        id: check
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pubspec version: $version"
          [ -z "$RELEASE_TAG" ] && exit 0
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v?[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::release_tag must look like 2.8, 2.8.1 or v2.8"
            exit 1
          fi
          # A tag newer than the app version would make the updater offer it forever.
          tag_version=${RELEASE_TAG#v}
          newest=$(printf '%s\n%s\n' "$tag_version" "$version" | sort -V | tail -1)
          if [ "$newest" != "$version" ]; then
            echo "::error::release_tag $RELEASE_TAG is newer than the app version $version in pubspec.yaml; bump pubspec first"
            exit 1
          fi

  # Secrets live in the `release` environment, which needs owner approval.
  build-android:
    needs: prepare
    if: inputs.platforms == 'all' || inputs.platforms == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --universal --no-android --no-ios
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the release environment"
              exit 1
            fi
          done
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/release.keystore"
          } > android/key.properties

      - name: Create env.json
        env:
          ENV_JSON_BASE64: ${{ secrets.ENV_JSON_BASE64 }}
        run: |
          if [ -n "$ENV_JSON_BASE64" ]; then
            umask 077
            echo "$ENV_JSON_BASE64" | base64 --decode > env.json
            echo "DART_DEFINES=--dart-define-from-file=env.json" >> "$GITHUB_ENV"
          else
            echo "::warning::ENV_JSON_BASE64 not set; building without env.json"
          fi

      # appambit_sdk_flutter 1.2.x ships AppambitSdkFlutterPlugin.kt (wrong case); flutter pub get rejects it on Linux.
      - name: Install dependencies
        run: |
          dart pub get --enforce-lockfile
          find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" \
            -path '*/appambit_sdk_flutter-*/android/src/main/kotlin/*/AppambitSdkFlutterPlugin.kt' |
          while read -r f; do
            mv -v "$f" "$(dirname "$f")/AppAmbitSdkFlutterPlugin.kt"
          done
          flutter pub get --enforce-lockfile

      - name: Build Android Release APKs
        run: |
          flutter build apk --release --flavor github --split-per-abi $DART_DEFINES
          flutter build apk --release --flavor github $DART_DEFINES

      # The in-app updater matches APKs by "-<abi>-" in the name.
      - name: Rename and Prepare APKs
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          out=build/release-assets
          dir=build/app/outputs/flutter-apk
          mkdir -p "$out"
          ls -1 "$dir"/*.apk
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            if [ "$abi" = universal ]; then
              candidates="$dir/app-github-release.apk"
            else
              candidates="$dir/app-${abi}-github-release.apk $dir/app-github-${abi}-release.apk"
            fi
            src=""
            for f in $candidates; do
              if [ -f "$f" ]; then src="$f"; break; fi
            done
            if [ -z "$src" ]; then
              echo "::error::No $abi APK found in $dir (see listing above)"
              exit 1
            fi
            cp "$src" "$out/looper-player-v${VERSION}-${abi}-release.apk"
          done

      - name: Verify APK Signatures
        run: |
          export JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | grep -v -- '-rc' | sort -V | tail -1)
          echo "Using $apksigner with $JAVA_HOME"
          for apk in build/release-assets/*.apk; do
            # Older apksigner prints "Signer #1 certificate ...", 37+ "V2 Signer: certificate ...".
            cert=$("$apksigner" verify --print-certs "$apk" |
              sed -nE 's/^(Signer #[0-9]+|V[0-9.]+ Signer:?) certificate SHA-256 digest: //p' | sort -u)
            if [ "$cert" != "$SIGNING_CERT_SHA256" ]; then
              echo "::error::$apk is signed with '$cert', expected $SIGNING_CERT_SHA256"
              exit 1
            fi
            echo "✓ $(basename "$apk")"
          done

      - name: Remove Signing Material
        if: always()
        run: rm -f android/app/release.keystore android/key.properties env.json

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-apks
          path: build/release-assets/*.apk
          if-no-files-found: error
          retention-days: 14

  # 22.04 keeps the glibc floor at 2.35.
  build-linux:
    needs: prepare
    if: inputs.platforms == 'all' || inputs.platforms == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      MAINTAINER: ${{ vars.LINUX_MAINTAINER || 'sthrnilshaaa <sthrnilshaaa@users.noreply.github.com>' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            rpm imagemagick desktop-file-utils binutils file

      - name: Install appimagetool
        run: |
          mkdir -p "$HOME/.local/bin"
          tool="$HOME/.local/bin/appimagetool"
          curl -fsSL -o "$tool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tool" | sha256sum -c -
          chmod +x "$tool"

      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_COMMIT"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" precache --universal --no-android --no-ios
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      # Same appambit file-name fix as the Android job.
      - name: Install Project Dependencies
        run: |
          dart pub get --enforce-lockfile
          find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" \
            -path '*/appambit_sdk_flutter-*/android/src/main/kotlin/*/AppambitSdkFlutterPlugin.kt' |
          while read -r f; do
            mv -v "$f" "$(dirname "$f")/AppAmbitSdkFlutterPlugin.kt"
          done
          flutter pub get --enforce-lockfile

      - name: Build Linux Packages
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./package.sh linux --build
          cd dist/linux
          for f in "looper-player_${VERSION}_amd64.deb" \
                   "looper-player-${VERSION}-1.x86_64.rpm" \
                   "looper-player_${VERSION}_linux_x64.tar.gz" \
                   "looper-player_${VERSION}_x86_64.AppImage"; do
            if [ ! -f "$f" ]; then
              echo "::error::$f was not built"; ls -l; exit 1
            fi
          done
          rm -f SHA256SUMS-*.txt

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages
          path: dist/linux/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [prepare, build-android, build-linux]
    if: >-
      always() && inputs.release_tag != '' &&
      needs.prepare.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download Android Artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-apks
          path: release-binaries

      - name: Download Linux Artifacts
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages
          path: release-binaries

      - name: Write Checksums
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd release-binaries
          sha256sum -- * > "SHA256SUMS-v${VERSION}.txt"
          ls -lh
          cat "SHA256SUMS-v${VERSION}.txt"

      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: media/release-notes
          path: src

      # media/release-notes/<tag>.md if it exists, otherwise a default text plus
      # GitHub's generated list of changes.
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          notes="src/media/release-notes/${TAG_NAME}.md"
          generate=""
          if [ ! -f "$notes" ]; then
            echo "::warning::$notes not found; using the default notes"
            notes=default-notes.md
            generate=--generate-notes
            cat > "$notes" <<EOF
          ## Looper Player $TAG_NAME

          #### Downloads
          - **Android**: pick the APK for your phone (\`arm64-v8a\` for most phones) or the universal APK.
          - **Linux**: \`.deb\` (Debian/Ubuntu), \`.rpm\` (Fedora/openSUSE), \`.AppImage\`, or the portable \`.tar.gz\` with an install script.

          Verify downloads with the \`SHA256SUMS\` file.
          EOF
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-binaries/* --clobber
            [ -z "$generate" ] && gh release edit "$TAG_NAME" --notes-file "$notes"
            exit 0
          fi

          gh release create "$TAG_NAME" release-binaries/* \
            --target "$GITHUB_SHA" \
            --title "Looper Player $TAG_NAME" \
            --notes-file "$notes" $generate
